[project]
name = "automatic-freelance-task-completer"
version = "0.1.0"
description = "Automatic freelance task completer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "feedparser>=6.0.14",
    "gitpython>=3.1.62",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "litellm>=1.101.0",
    "loguru>=0.7.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.53",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.7",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

plugins = [
    "pydantic.mypy"
]

[tool.ruff]
target-version = "py313"

line-length = 100

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "storage/tasks",
    "**/alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "RUF",
]

ignore = [
    "E501",
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["packages", "services"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
